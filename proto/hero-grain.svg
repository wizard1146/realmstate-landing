<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <!-- Texture for the navy hero, unlike the page's paper: long, faint horizontal fibres, like laid paper or worn cloth,
       with a light dusting of specks. Pale on transparent, so it lightens the navy a touch. Tiles seamlessly. -->
  <filter id="fibre" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".02 .45" numOctaves="3" seed="21" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .92  0 0 0 0 .89  0 0 0 0 .82  1.6 0 0 0 -.75"/>
  </filter>
  <filter id="speck" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="1" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .95  0 0 0 0 .92  0 0 0 0 .85  4 0 0 0 -2.6"/>
  </filter>
  <rect width="360" height="360" filter="url(#fibre)" opacity=".035"/>
  <rect width="360" height="360" filter="url(#speck)" opacity=".12"/>
</svg>
